<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Family Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2230;--muted:#80869a;--line:#ebe6dc;--soft:#f6f3ec;--accent:#4f63ff;--accent-ink:#fff;--today:#fff3cf;--hour:56px;--r:22px;--shadow:0 2px 12px rgba(30,30,60,.06),0 1px 2px rgba(30,30,60,.04);--good:#2fbf71;--bad:#e5484d;--warn:#f5b301}
body.dark{--bg:#11131a;--card:#1a1d27;--ink:#e9ebf2;--muted:#8d93a6;--line:#2a2e3b;--soft:#232735;--accent:#8a97ff;--accent-ink:#11131a;--today:#2a2817;--shadow:none}
body.hasbg{background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;--soft:rgba(128,128,128,.16);--line:rgba(128,128,128,.28);--shadow:0 4px 24px rgba(0,0,0,.18)}
body.hasbg .clock,body.hasbg .hubname{background:var(--cardbg,var(--card));-webkit-backdrop-filter:blur(var(--blur,0px));backdrop-filter:blur(var(--blur,0px));border-radius:18px;padding:8px 16px;box-shadow:var(--shadow)}
body.hasbg .clock{padding-top:24px}
#ytbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;display:none}
#ytbg.on{display:block}
#ytbg iframe{position:absolute;top:50%;left:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%);border:0}
.warn{font-size:13px;font-weight:700;background:color-mix(in srgb,var(--warn) 18%,var(--card));border-radius:10px;padding:8px 12px;margin:0 0 12px;line-height:1.45}
/* Spotify */
.spbar{display:none;align-items:center;gap:10px;margin:0 16px 14px;padding:6px 8px 6px 6px;border-radius:999px;background:var(--cardbg,var(--card));-webkit-backdrop-filter:blur(var(--blur,0px));backdrop-filter:blur(var(--blur,0px));box-shadow:var(--shadow);min-width:0}
.spbar.on{display:flex}
main.sp{padding-bottom:10px}
.spbtn{display:flex;align-items:center;gap:6px;background:#1db954;color:#fff;font-weight:900;font-size:14px;padding:8px 14px;border-radius:999px;flex:none}
.spnow{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-weight:800;font-size:14px}
.spnow img{width:32px;height:32px;border-radius:6px;object-fit:cover;flex:none}
.spnow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spnow .t small{color:var(--muted);font-weight:700;margin-left:6px}
.spctl{display:flex;gap:4px;flex:none}
.spctl button,.spbig button.c{width:38px;height:38px;border-radius:50%;background:var(--soft);font-size:15px;display:grid;place-items:center}
.spbig{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:18px;padding:12px;margin-bottom:12px}
.spbig img,.spbig .ph{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.spbig .info{flex:1;min-width:0}
.spbig .info b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbig .info small{display:block;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbig button.c.pp{width:48px;height:48px;background:#1db954;color:#fff;font-size:18px}
.sptabs{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.sptabs button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:var(--soft);color:var(--muted)}
.sptabs button.on{background:var(--ink);color:var(--card)}
.sptabs select{width:auto;margin-left:auto;padding:7px 10px;font-size:13px}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;max-height:52vh;overflow-y:auto;padding:2px}
.spgrid button{text-align:left;border-radius:12px;padding:6px;transition:background .15s}
.spgrid button:hover{background:var(--soft)}
.spgrid img,.spgrid .ph{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:34px}
.spgrid b{display:block;font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spgrid small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal.spot{width:min(900px,100%)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;transition:background .4s}
body.idle,body.idle *{cursor:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;user-select:text;-webkit-user-select:text;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}

#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
.top{display:flex;align-items:flex-end;gap:20px;padding:16px 24px 8px}
.clock{display:flex;align-items:baseline;gap:18px}
.clock .time{font-size:60px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.clock .time small{font-size:22px;font-weight:800;margin-left:4px;letter-spacing:0;color:var(--muted)}
.clock .date{font-size:24px;color:var(--muted);font-weight:800}
.dcol{position:relative}
.london{position:absolute;left:0;bottom:100%;margin-bottom:2px;white-space:nowrap;font-size:15px;font-weight:800;color:var(--muted);display:flex;align-items:baseline;gap:6px}
.london b{color:var(--ink);font-weight:900}
.london small{font-size:12px;opacity:.8}
.wxrow .alt{font-size:15px;font-weight:800;color:var(--muted);align-self:flex-start;margin:4px 0 0 -6px}
.hubname{margin-left:auto;font-weight:900;font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;align-self:center}
.topbtns{display:flex;gap:6px;align-self:center;opacity:.35;transition:opacity .2s}
.topbtns:hover,.topbtns:focus-within{opacity:1}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px}

main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;padding:8px 16px 16px;min-height:0}
aside{display:flex;flex-direction:column;gap:16px;min-height:0}
.card{background:var(--cardbg,var(--card));-webkit-backdrop-filter:blur(var(--blur,0px));backdrop-filter:blur(var(--blur,0px));border-radius:var(--r);box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 18px 0;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
.card-h .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:800;display:flex;align-items:center;gap:6px}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar h1{font-size:23px;margin:0 8px;font-weight:900;white-space:nowrap}
.nav{width:38px;height:38px;border-radius:50%;background:var(--soft);font-size:20px;font-weight:900;display:grid;place-items:center}
.pill{padding:8px 14px;border-radius:999px;background:var(--soft);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-left:auto}
.seg button{padding:6px 14px;border-radius:999px;font-weight:800;color:var(--muted);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.add{background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:999px;font-weight:900;font-size:14px;white-space:nowrap}
.ctl{transition:opacity .3s}
body.idle .ctl{opacity:0;pointer-events:none}
.sync{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.sync.ok{background:var(--good)}.sync.syncing{background:var(--warn);animation:pulse 1s infinite}.sync.error{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
#calbody{flex:1;min-height:0;display:flex;flex-direction:column}

/* time grid */
.tg{display:flex;flex-direction:column;flex:1;min-height:0}
.tg-head,.tg-adrow,.tg-inner{display:grid}
.tg-dh{padding:8px 4px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tg-dh .dow{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.tg-dh .dnum{font-size:22px;font-weight:900;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.tg-dh.is-today .dnum{background:var(--accent);color:var(--accent-ink)}
.dwx{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.tg-adrow{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tg-adlabel{font-size:10px;color:var(--muted);padding:8px 6px 0 0;text-align:right;font-weight:800;text-transform:uppercase}
.tg-ad{min-height:30px;padding:3px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;max-height:84px;overflow:hidden;min-width:0}
.tg-body{flex:1;overflow-y:auto;min-height:0;position:relative;scrollbar-width:none}
.tg-body::-webkit-scrollbar{display:none}
.tg-inner{height:calc(24 * var(--hour));position:relative}
.tg-hours{position:relative}
.tg-hours span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-weight:800;white-space:nowrap}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hour);cursor:pointer;min-width:0}
.tg-col.is-today{background-color:color-mix(in srgb,var(--today) 55%,transparent)}
.ev{position:absolute;border-radius:9px;padding:3px 7px;font-size:13px;overflow:hidden;background:color-mix(in srgb,var(--c) 22%,var(--card));border-left:4px solid var(--c);line-height:1.25;cursor:pointer;display:flex;flex-direction:column;z-index:2}
.ev b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.now::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.chip{font-size:12.5px;padding:3px 7px;border-radius:7px;background:color-mix(in srgb,var(--c) 22%,var(--card));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;cursor:pointer;flex-shrink:0}
.chip i{font-style:normal;color:var(--muted);font-weight:700;margin-right:3px}

/* month */
.month{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(6,minmax(0,1fr));min-height:0}
.mdow{text-align:center;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;padding:9px 0;letter-spacing:.6px}
.mcell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;min-height:0;min-width:0}
.mcell:nth-child(7n+1){border-left:0}
.mcell.other>*{opacity:.45}
.mcell.is-today{background:color-mix(in srgb,var(--today) 70%,transparent)}
.mnum{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px;padding:0 2px;gap:4px}
.mcell.is-today .mnum span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px}
.mnum small{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden}
.more{font-size:12px;color:var(--muted);font-weight:800;padding-left:4px}

/* weather box */
#wxcard{flex:none}
.wxbody{padding:6px 18px 16px}
.wxrow{display:flex;align-items:center;gap:12px}
.wxrow .ic{font-size:58px;line-height:1}
.wxrow .t{font-size:52px;font-weight:900;line-height:1;letter-spacing:-1px}
.wxrow .d{font-weight:800;line-height:1.35;font-size:14px;flex:1;min-width:0}
.wxrow .d small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.hourly{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px;text-align:center;font-size:11.5px;font-weight:800;color:var(--muted)}
.hourly b{display:block;color:var(--ink);font-size:14px}
.hourly .e{font-size:18px;display:block;margin:2px 0}
.hourly .pp{display:block;color:#3b8bea;font-size:10.5px;min-height:13px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.days div{background:var(--soft);border-radius:14px;padding:8px 2px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.days .e{font-size:22px;display:block;margin:2px 0}
.days b{color:var(--ink);font-size:15px}
.days .pp{display:block;color:#3b8bea;font-size:10.5px;min-height:13px}

/* fantasy box */
#ffcard{flex:1}
.ffbody{flex:1;min-height:0;padding:10px 16px 14px;display:flex;flex-direction:column;overflow:hidden}
.ffbody>*{flex-shrink:0}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.lgname{font-weight:900;font-size:17px;margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgname small{color:var(--muted);font-weight:800;font-size:13px;margin-left:6px}
.big{background:color-mix(in srgb,var(--accent) 8%,var(--soft));border:2px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:18px;padding:8px 12px;margin-bottom:12px}
.big .tm{display:flex;align-items:center;gap:10px;padding:6px 0}
.big .tm+.tm{border-top:1px dashed var(--line)}
.logo{width:36px;height:36px;border-radius:50%;flex:none;background:var(--line);object-fit:cover;display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--muted);overflow:hidden}
.big .nm{flex:1;min-width:0}
.big .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.big .nm small{color:var(--muted);font-weight:700;font-size:12px}
.big .pts{text-align:right;font-size:26px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.05}
.big .pts small{display:block;font-size:11px;font-weight:800}
.big .tm.lead .pts{color:var(--ink)}
.you{font-size:10px;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.wp{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 2px;display:flex}
.wp i{background:var(--accent)}
.sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:900;margin:2px 0 6px}
.mrow{display:grid;grid-template-columns:24px minmax(0,1fr) 52px 52px minmax(0,1fr) 24px;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px}
.mrow:last-child{border:0}
.mrow .logo{width:24px;height:24px;font-size:10px}
.mrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .n.r{text-align:right}
.mrow .p{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.mrow .p.w{color:var(--ink);font-weight:900}
.stand{width:100%;border-collapse:collapse;font-size:14px}
.stand th{font-size:11px;color:var(--muted);text-align:right;font-weight:900;padding:2px 4px 6px;text-transform:uppercase}
.stand th:nth-child(2){text-align:left}
.stand td{padding:5px 4px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.stand td:first-child{color:var(--muted);width:22px}
.stand td.tn{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.stand td.n{text-align:right;font-variant-numeric:tabular-nums}
.stand tr.me td{color:var(--accent);font-weight:900}
.gtop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.gs{background:var(--soft);border-radius:14px;padding:8px 10px;min-width:0}
.gs.lead{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.gn{display:flex;align-items:center;gap:6px;min-width:0}
.gn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn .logo{width:22px;height:22px;font-size:9px}
.gv{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.gv span{font-size:26px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1}
.gs.lead .gv span{color:var(--ink)}
.gv small{font-size:10.5px;color:var(--muted);font-weight:700;text-align:right;line-height:1.25}
.gs.r .gn{flex-direction:row-reverse;text-align:right}
.gs.r .gv{flex-direction:row-reverse}
.gs.r .gv small{text-align:left}
.lineup{flex:1;min-height:0;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 40px 34px 40px minmax(0,1fr);align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:0}
.pl{min-width:0;line-height:1.2}
.pl.r{text-align:right}
.pl b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small.in{color:var(--bad)}
.pp{text-align:center;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.pp.proj{color:var(--muted);font-weight:700;font-style:italic}
.pp.live{color:var(--bad)}
.sl{text-align:center;font-size:10px;font-weight:900;color:var(--muted);background:var(--soft);border-radius:6px;padding:3px 0}
.pkstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.pkstats div{background:var(--soft);border-radius:12px;padding:6px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.pkstats b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.pkx{font-size:12px;font-weight:700;color:var(--muted);margin:-4px 0 8px;line-height:1.4}
.rides{flex:1;min-height:0;overflow:hidden}
.ride{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px}
.ride:last-child{border:0}
.ride span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt{flex:none;min-width:52px;text-align:center;border-radius:999px;padding:2px 8px;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff}
.wt.g{background:#2fbf71}.wt.y{background:#e3a008}.wt.o{background:#f0752b}.wt.r{background:#e5484d}.wt.x{background:var(--soft);color:var(--muted)}
.open-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:middle}
.open-dot.no{background:var(--muted)}
.bgprev{width:120px;height:68px;border-radius:10px;background:var(--soft) center/cover no-repeat;border:1.5px solid var(--line);flex:none}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:0}
.empty{text-align:center;padding:20px 10px;color:var(--muted);margin:auto 0}
.empty .bigic{font-size:44px}
.empty h3{color:var(--ink);margin:8px 0 4px;font-size:17px}
.empty p{margin:0 0 14px;line-height:1.45;font-size:14px}
.updated{font-size:11px;color:var(--muted);text-align:center;font-weight:700;margin-top:auto;padding-top:8px}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(15,18,30,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:24px;width:min(600px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(740px,100%)}
.modal h2{margin:0 0 16px;font-size:23px;font-weight:900}
.modal h3{margin:22px 0 4px;font-size:16px;font-weight:900}
.modal .help{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.modal .help code{background:var(--soft);padding:1px 6px;border-radius:6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:12px;min-width:0}
.check{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:12px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.actions{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{padding:10px 18px;border-radius:999px;font-weight:900;background:var(--soft);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatches button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.callist{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;max-height:220px;overflow:auto}
.callist label{display:flex;align-items:center;gap:10px;padding:5px 4px;font-weight:700;cursor:pointer}
.callist .dot{width:12px;height:12px;border-radius:50%;flex:none}
.status{font-size:13px;font-weight:800;margin:4px 0 10px}
.status.ok{color:var(--good)}.status.err{color:var(--bad)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:999px;font-weight:800;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}
.ro{font-size:13px;color:var(--muted);font-weight:700;background:var(--soft);padding:8px 12px;border-radius:10px;margin-bottom:12px}

@media (max-height:850px){ .clock .time{font-size:46px} .top{padding:10px 22px 4px} .stand td{padding:3px 4px} .mrow{padding:4px 0} .big .tm{padding:3px 0} .big .pts{font-size:22px} .days .e,.hourly .e{font-size:16px} .wxrow .ic{font-size:46px} .wxrow .t{font-size:42px} .lgname{margin-bottom:6px} .lrow{padding:1px 0} .pl b{font-size:12px} .pl small{font-size:10px} .gv span{font-size:21px} .gs{padding:5px 8px} }
@media (max-width:1150px){ main{grid-template-columns:minmax(0,1fr) 340px} .clock .time{font-size:48px} .clock .date{font-size:19px} .wxrow .t{font-size:42px} .wxrow .ic{font-size:46px} }
@media (max-width:820px){ body{overflow:auto} #app{height:auto} main{grid-template-columns:1fr} #calcard{height:80vh} #ffcard{min-height:420px} }

<body>
<div id="ytbg"></div>
<div id="app">
  <header class="top">
    <div class="clock"><div class="time" id="time"></div><div class="dcol"><div class="london" id="london"></div><div class="date" id="date"></div></div></div>
    <div class="hubname" id="hubname"></div>
    <div class="topbtns ctl">
      <button class="ibtn" id="btn-sound" title="Video sound on/off" style="display:none">🔇</button>
      <button class="ibtn" id="btn-refresh" title="Refresh everything">⟳</button>
      <button class="ibtn" id="btn-full" title="Full screen (F)">⛶</button>
      <button class="ibtn" id="btn-settings" title="Settings">⚙️</button>
    </div>
  </header>
  <main>
    <section class="card" id="calcard">
      <div class="toolbar">
        <h1 id="range"></h1>
        <span class="sync" id="sync" title=""></span>
        <div class="ctl" style="display:flex;gap:8px;align-items:center;margin-left:auto">
          <button class="nav" id="prev" aria-label="Previous">‹</button>
          <button class="nav" id="next" aria-label="Next">›</button>
          <button class="pill" id="today">Today</button>
          <div class="seg" id="viewseg"><button data-v="day">Day</button><button data-v="week">Week</button><button data-v="month">Month</button></div>
          <button class="add" id="addbtn">＋ Event</button>
        </div>
      </div>
      <div id="calbody"></div>
    </section>
    <aside>
      <section class="card" id="wxcard">
        <div class="card-h">☀️ Weather <span class="r" id="wxcity"></span></div>
        <div class="wxbody" id="wx"></div>
      </section>
      <section class="card" id="ffcard">
        <div class="card-h"><span id="boxtitle">🏈 Fantasy football</span><span class="r" id="ffmeta"></span></div>
        <div class="ffbody" id="ff"></div>
      </section>
    </aside>
  </main>
  <footer class="spbar" id="spbar">
    <button class="spbtn" id="spbtn" title="Open Spotify library">🎵 Spotify</button>
    <div class="spnow" id="spnow"></div>
    <div class="spctl ctl"><button id="sp-prev" title="Previous">⏮</button><button id="sp-play" title="Play/pause">⏯</button><button id="sp-next" title="Next">⏭</button></div>
  </footer>
</div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('hub.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hub.' + k, JSON.stringify(v)); } catch {} }
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
let HOUR = 56;
const pad = n => String(n).padStart(2, '0');
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, dd] = s.split('-').map(Number); return new Date(y, m - 1, dd); };
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtTime = d => S.use24h ? hm(d)
  : d.toLocaleTimeString('en-US', d.getMinutes() ? { hour: 'numeric', minute: '2-digit' } : { hour: 'numeric' }).replace(/\s/g, '').toLowerCase();
const fmtHourLabel = h => S.use24h ? `${pad(h)}:00` : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
const fmtPts = n => (Math.round((n || 0) * 10) / 10).toFixed(1);

async function getJSON(url, opts = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out' : (e.message || 'Network error'));
  } finally { clearTimeout(t); }
}
let toastTimer;
function toast(msg) {
  $('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
}

/* ================= settings & state ================= */
const DEFAULTS = {
  title: 'Family Hub', use24h: false, weekStart: 0, night: 'auto', dayStartHour: 7, dayEndHour: 22, defaultView: 'week',
  bridgeUrl: '', bridgeKey: '', selectedCals: null, defaultCal: '',
  city: 'New York, NY', lat: 40.7128, lon: -74.006, units: 'fahrenheit',
  espnLeagues: '', espnTeam: '', rotateSecs: 20,
  showFantasy: true, showParks: false, parkIds: [], parkNames: {},
  boxOpacity: 72, boxBlur: true, bgTheme: 'auto', ytUrl: '', ytSound: false,
  spClientId: '', spDevice: 'surrounded'
};
let S = Object.assign({}, DEFAULTS, LS.get('settings', {}));
const saveSettings = () => LS.set('settings', S);

const state = {
  view: S.defaultView, cursor: sod(new Date()), events: [],
  calendars: LS.get('calendars', []), weather: LS.get('weatherCache', null),
  fantasy: LS.get('ffCache', null), ffPage: 0, parks: {}, tpBridge: false, bg: LS.get('bg', null),
  cache: {}, loadSeq: 0, sync: 'off', syncMsg: ''
};

const PALETTE = ['#7c6cf0', '#4f9dff', '#2fbf71', '#f5b301', '#ff8a3d', '#ff5d7a', '#00b8c4', '#a86b4c'];
const EVCOLORS = { 1: '#7986cb', 2: '#33b679', 3: '#8e24aa', 4: '#e67c73', 5: '#f6bf26', 6: '#f4511e', 7: '#039be5', 8: '#616161', 9: '#3f51b5', 10: '#0b8043', 11: '#d50000' };

/* ================= local (device) events ================= */
function getLocalRaw() { return LS.get('localEvents', []); }
function setLocalRaw(a) { LS.set('localEvents', a); }
function normLocal(ev) {
  return {
    id: ev.id, key: 'local|' + ev.id, calId: 'local', source: 'local', title: ev.title,
    allDay: !!ev.allDay, start: ev.allDay ? parseYmd(ev.start) : new Date(ev.start),
    end: ev.allDay ? parseYmd(ev.end) : new Date(ev.end), location: ev.location || '',
    description: ev.description || '', color: ev.color || PALETTE[0], writable: true
  };
}
function seedDemo() {
  if (LS.get('seeded', false)) return;
  const t = sod(new Date());
  const at = (dayOff, h, m = 0) => { const d = addDays(t, dayOff); d.setHours(h, m); return d.toISOString(); };
  setLocalRaw([
    { id: uid(), title: 'Soccer practice (sample)', start: at(0, 16, 30), end: at(0, 17, 45), color: '#2fbf71', location: 'Riverside Park' },
    { id: uid(), title: 'Family dinner (sample)', start: at(1, 18, 30), end: at(1, 20), color: '#ff8a3d' },
    { id: uid(), title: 'Dentist (sample)', start: at(-1, 9), end: at(-1, 10), color: '#4f9dff' },
    { id: uid(), title: 'Grandma visiting (sample)', allDay: true, start: ymd(addDays(t, 2)), end: ymd(addDays(t, 4)), color: '#7c6cf0' }
  ]);
  LS.set('seeded', true);
}

/* ================= Google Apps Script bridge ================= */
async function bridge(action, params = {}, post = false) {
  if (!S.bridgeUrl) throw new Error('Bridge not set up');
  const body = { ...params, action, key: S.bridgeKey };
  let j;
  if (post) {
    j = await getJSON(S.bridgeUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } else {
    const u = new URL(S.bridgeUrl);
    Object.entries(body).forEach(([k, v]) => u.searchParams.set(k, v));
    j = await getJSON(u.toString());
  }
  if (j.error) throw new Error(j.error);
  return j;
}
const calById = id => state.calendars.find(c => c.id === id);
function selectedCalIds() {
  if (Array.isArray(S.selectedCals)) return S.selectedCals;
  return state.calendars.filter(c => !c.hidden).map(c => c.id);
}
function normGoogle(ev) {
  const cal = calById(ev.calId);
  return {
    id: ev.id, key: ev.calId + '|' + ev.id + '|' + ev.start, calId: ev.calId, source: 'google',
    title: ev.title || '(No title)', allDay: !!ev.allDay,
    start: ev.allDay ? parseYmd(ev.start) : new Date(ev.start),
    end: ev.allDay ? parseYmd(ev.end) : new Date(ev.end),
    origStart: ev.start, location: ev.location || '', description: ev.description || '',
    color: EVCOLORS[ev.color] || cal?.color || '#4f9dff', writable: cal ? cal.writable !== false : true,
    recurring: !!ev.recurring
  };
}
async function loadCalendars() {
  const r = await bridge('calendars');
  state.calendars = r.calendars || [];
  LS.set('calendars', state.calendars);
  return state.calendars;
}

/* ================= calendar ================= */
function sow(d) { const x = sod(d); return addDays(x, -((x.getDay() - S.weekStart + 7) % 7)); }
function viewRange() {
  const c = state.cursor;
  if (state.view === 'day') return [sod(c), addDays(sod(c), 1)];
  if (state.view === 'week') { const s = sow(c); return [s, addDays(s, 7)]; }
  const s = sow(new Date(c.getFullYear(), c.getMonth(), 1));
  return [s, addDays(s, 42)];
}
function setSync(st, msg = '') {
  state.sync = st; state.syncMsg = msg;
  const dot = $('#sync'); dot.className = 'sync ' + st;
  dot.title = msg || (S.bridgeUrl ? 'Google Calendar' : 'Events saved on this device only');
}
async function loadEvents() {
  const [s, e] = viewRange();
  const rk = s.toISOString() + '|' + e.toISOString();
  const local = () => getLocalRaw().map(normLocal).filter(x => x.end > s && x.start < e);
  state.events = [...(state.cache[rk] || []), ...local()];
  renderCalendar();
  if (!S.bridgeUrl) { setSync('off'); return; }
  const seq = ++state.loadSeq;
  setSync('syncing');
  try {
    if (!state.calendars.length) await loadCalendars();
    const ids = selectedCalIds();
    const r = await bridge('events', { start: s.toISOString(), end: e.toISOString(), cals: ids.length ? ids.join(',') : '__none__' });
    const g = (r.events || []).map(normGoogle);
    state.cache[rk] = g;
    if (seq !== state.loadSeq) return;
    state.events = [...g, ...local()];
    setSync('ok', 'Google Calendar · synced ' + fmtTime(new Date()));
    renderCalendar();
  } catch (err) {
    if (seq === state.loadSeq) setSync('error', 'Google sync failed: ' + err.message);
  }
}
const invalidate = () => { state.cache = {}; };

function overlapsDay(e, d) { const s = sod(d), en = addDays(s, 1); return e.start < en && e.end > s; }
function eventsOnDay(d) { return state.events.filter(e => overlapsDay(e, d)).sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start)); }
function wxFor(d) {
  const w = state.weather?.daily; if (!w) return '';
  const i = w.time.indexOf(ymd(d)); if (i < 0) return '';
  return `${wmo(w.weather_code[i])[0]} ${Math.round(w.temperature_2m_max[i])}°/${Math.round(w.temperature_2m_min[i])}°`;
}
function chip(e) { return `<div class="chip" data-key="${esc(e.key)}" style="--c:${e.color}">${e.allDay ? '' : `<i>${fmtTime(e.start)}</i>`}${esc(e.title)}</div>`; }
function rangeTitle() {
  const [s, e] = viewRange(), c = state.cursor;
  if (state.view === 'day') return c.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  if (state.view === 'month') return c.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const l = addDays(e, -1);
  const sm = s.toLocaleDateString('en-US', { month: 'short' }), lm = l.toLocaleDateString('en-US', { month: 'short' });
  return sm === lm ? `${sm} ${s.getDate()} – ${l.getDate()}` : `${sm} ${s.getDate()} – ${lm} ${l.getDate()}`;
}
function renderCalendar(refit = true) {
  $('#range').textContent = rangeTitle();
  $$('#viewseg button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  const body = $('#calbody');
  if (state.view === 'month') { body.innerHTML = renderMonth(); return; }
  const [s] = viewRange();
  const n = state.view === 'day' ? 1 : 7;
  body.innerHTML = renderTimeGrid(Array.from({ length: n }, (_, i) => addDays(s, i)));
  const tb = $('.tg-body');
  // Fit the chosen hours (e.g. 7am–10pm) to the screen so nothing needs scrolling.
  const span = Math.max(4, S.dayEndHour - S.dayStartHour);
  const fit = Math.max(22, Math.floor((tb.clientHeight - 14) / span));
  if (refit && Math.abs(fit - HOUR) > 1) { HOUR = fit; document.documentElement.style.setProperty('--hour', HOUR + 'px'); return renderCalendar(false); }
  tb.scrollTop = Math.max(0, S.dayStartHour * HOUR - 10);
}
function renderTimeGrid(days) {
  const n = days.length, cols = `52px repeat(${n}, minmax(0,1fr))`, today = new Date();
  let h = `<div class="tg"><div class="tg-head" style="grid-template-columns:${cols}"><div></div>`;
  h += days.map(d => {
    const w = wxFor(d);
    return `<div class="tg-dh ${sameDay(d, today) ? 'is-today' : ''}" data-day="${ymd(d)}"><span class="dow">${d.toLocaleDateString('en-US', { weekday: 'short' })}</span><span class="dnum">${d.getDate()}</span>${w ? `<span class="dwx">${w}</span>` : ''}</div>`;
  }).join('') + '</div>';
  h += `<div class="tg-adrow" style="grid-template-columns:${cols}"><div class="tg-adlabel">all day</div>`;
  h += days.map(d => `<div class="tg-ad" data-day="${ymd(d)}">${state.events.filter(e => e.allDay && overlapsDay(e, d)).map(chip).join('')}</div>`).join('') + '</div>';
  let hours = '';
  for (let i = 1; i < 24; i++) hours += `<span style="top:${i * HOUR}px">${fmtHourLabel(i)}</span>`;
  h += `<div class="tg-body"><div class="tg-inner" style="grid-template-columns:${cols}"><div class="tg-hours">${hours}</div>`;
  days.forEach(d => {
    const isT = sameDay(d, today);
    const nowLine = isT ? `<div class="now" style="top:${(today.getHours() * 60 + today.getMinutes()) / 60 * HOUR}px"></div>` : '';
    h += `<div class="tg-col ${isT ? 'is-today' : ''}" data-day="${ymd(d)}">${layoutDay(d)}${nowLine}</div>`;
  });
  return h + '</div></div></div>';
}
function layoutDay(d) {
  const ds = sod(d), de = addDays(ds, 1);
  const segs = state.events.filter(e => !e.allDay && e.start < de && e.end > ds)
    .map(e => ({ e, s: Math.max(+e.start, +ds), en: Math.min(+e.end, +de) }))
    .sort((a, b) => a.s - b.s || b.en - a.en);
  let out = '', cluster = [], lanes = [], clusterEnd = 0;
  const flush = () => { cluster.forEach(c => { out += evBlock(c, lanes.length, ds); }); cluster = []; lanes = []; clusterEnd = 0; };
  segs.forEach(sg => {
    if (cluster.length && sg.s >= clusterEnd) flush();
    let lane = lanes.findIndex(end => end <= sg.s);
    if (lane < 0) { lane = lanes.length; lanes.push(sg.en); } else lanes[lane] = sg.en;
    sg.lane = lane; cluster.push(sg); clusterEnd = Math.max(clusterEnd, sg.en);
  });
  flush();
  return out;
}
function evBlock(sg, n, ds) {
  const top = (sg.s - ds) / 36e5 * HOUR;
  const ht = Math.max((sg.en - sg.s) / 36e5 * HOUR, 22);
  const w = 100 / n, e = sg.e;
  const time = ht > 36 ? `<span>${fmtTime(e.start)} – ${fmtTime(e.end)}${e.location && ht > 54 ? ' · ' + esc(e.location) : ''}</span>` : '';
  return `<div class="ev" data-key="${esc(e.key)}" style="top:${top}px;height:${ht - 2}px;left:calc(${sg.lane * w}% + 2px);width:calc(${w}% - 4px);--c:${e.color}"><b>${ht <= 36 ? fmtTime(e.start) + ' ' : ''}${esc(e.title)}</b>${time}</div>`;
}
function renderMonth() {
  const [s] = viewRange(), m = state.cursor.getMonth(), today = new Date();
  const bodyH = $('#calbody').clientHeight || 600;
  const max = Math.max(1, Math.floor(((bodyH - 36) / 6 - 30) / 23));
  let h = '<div class="month">';
  for (let i = 0; i < 7; i++) h += `<div class="mdow">${addDays(s, i).toLocaleDateString('en-US', { weekday: 'short' })}</div>`;
  for (let i = 0; i < 42; i++) {
    const d = addDays(s, i), evs = eventsOnDay(d), w = wxFor(d);
    const shown = evs.length > max ? max - 1 : max;
    h += `<div class="mcell ${d.getMonth() !== m ? 'other' : ''} ${sameDay(d, today) ? 'is-today' : ''}" data-day="${ymd(d)}">
      <div class="mnum"><span>${d.getDate()}</span>${w ? `<small>${w}</small>` : ''}</div>
      ${evs.slice(0, Math.max(shown, 0)).map(chip).join('')}${evs.length > shown ? `<div class="more">+${evs.length - shown} more</div>` : ''}</div>`;
  }
  return h + '</div>';
}

/* ================= event editor ================= */
function openModal(html, cls = '') {
  closeModal();
  const b = document.createElement('div'); b.className = 'backdrop';
  b.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  b.addEventListener('mousedown', e => { b.dataset.down = e.target === b ? '1' : ''; });
  b.addEventListener('click', e => { if (e.target === b && b.dataset.down) closeModal(); });
  document.body.appendChild(b);
  return b.firstElementChild;
}
function closeModal() { $('.backdrop')?.remove(); }
function writableCals() { return state.calendars.filter(c => c.writable !== false); }
function roundedNow() { const d = new Date(); d.setMinutes(d.getMinutes() < 30 ? 30 : 60, 0, 0); return d; }

function openEditor(existing, preset = {}) {
  const ev = existing || {
    title: '', allDay: !!preset.allDay, calId: S.defaultCal || (S.bridgeUrl ? (state.calendars.find(c => c.primary)?.id || '') : 'local'),
    start: preset.start || roundedNow(), end: preset.end || new Date(+(preset.start || roundedNow()) + 36e5),
    location: '', description: '', color: PALETTE[0], writable: true
  };
  if (!S.bridgeUrl && !existing) ev.calId = 'local';
  const ro = existing && !existing.writable;
  const endIncl = ev.allDay ? addDays(ev.end, -1) : ev.end;
  let calOpts = writableCals().map(c => `<option value="${esc(c.id)}" ${c.id === ev.calId ? 'selected' : ''}>${esc(c.name)}${c.primary ? ' (main)' : ''}</option>`).join('');
  if (ro) calOpts = `<option>${esc(calById(ev.calId)?.name || 'Read-only calendar')}</option>`;
  calOpts += `<option value="local" ${ev.calId === 'local' ? 'selected' : ''}>This display only</option>`;

    if (S.showParks && !S.showFantasy) { title.textContent = '🏰 Theme parks'; $('#ff').innerHTML = emptyBox('🏰', 'Pick your parks', 'Choose which parks to follow in Settings ▸ Theme parks.', 'Open settings'); }
    else { title.textContent = '🏈 Fantasy football'; renderFantasy(null); }
    return;
  }
  state.ffPage %= pages.length;
  const pg = pages[state.ffPage];
  meta.innerHTML = pages.length > 1 ? `<span class="dots">${pages.map((_, i) => `<i class="${i === state.ffPage ? 'on' : ''}"></i>`).join('')}</span>` : '';
  title.textContent = pg.src === 'ff' ? '🏈 Fantasy football' : '🏰 Theme parks';
  if (pg.src === 'ff') renderFantasy(pg); else renderPark(pg);
}

/* ================= Disney / theme parks (ThemeParks.wiki, free) ================= */
const TP = 'https://api.themeparks.wiki/';
async function tp(path) {
  if (!state.tpBridge) {
    try { return await getJSON(TP + path); }
    catch (e) { if (!S.bridgeUrl) throw e; state.tpBridge = true; }
  }
  return (await bridge('themeparks', { path })).data;
}
async function loadParks(force) {
  if (!S.showParks || !S.parkIds.length) { renderBox(); return; }
  await Promise.all(S.parkIds.map(async id => {
    const p = state.parks[id] ||= { id };
    try {
      const live = await tp(`v1/entity/${id}/live`);
      p.name = live.name || p.name; p.tz = live.timezone || p.tz;
      p.live = live.liveData || []; p.at = Date.now(); p.error = null;
      if (force || !p.schedule || Date.now() - (p.schedAt || 0) > 3 * 36e5) {
        const s = await tp(`v1/entity/${id}/schedule`);
        p.schedule = s.schedule || []; p.tz = s.timezone || p.tz; p.schedAt = Date.now();
      }
    } catch (e) { p.error = e.message; }
  }));
  renderBox();
}
function renderPark(pg) {
  const el = $('#ff'), p = state.parks[pg.id] || {};
  const name = p.name || S.parkNames[pg.id] || 'Park';
  if (!p.live) { el.innerHTML = `<div class="lgname">${esc(name)}</div>` + (p.error ? emptyBox('⚠️', 'Couldn’t load wait times', esc(p.error)) : '<div class="empty"><p>Loading wait times…</p></div>'); return; }
  const tz = p.tz || 'America/New_York', now = Date.now();
  const pt = iso => new Date(iso).toLocaleTimeString('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).replace(':00', '').replace(/\s/g, '').toLowerCase();
  const today = new Date().toLocaleDateString('en-CA', { timeZone: tz });
  const sched = (p.schedule || []).filter(s => s.openingTime && s.closingTime);
  const op = sched.find(s => s.date === today && s.type === 'OPERATING');
  const isOpen = !!op && now >= Date.parse(op.openingTime) && now < Date.parse(op.closingTime);
  const next = sched.filter(s => s.type === 'OPERATING' && Date.parse(s.openingTime) > now).sort((a, b) => Date.parse(a.openingTime) - Date.parse(b.openingTime))[0];
  const nextTxt = next ? `Opens ${next.date === today ? 'today' : new Date(next.openingTime).toLocaleDateString('en-US', { timeZone: tz, weekday: 'short' })} ${pt(next.openingTime)}` : 'Closed';
  const extras = sched.filter(s => s.date === today && s.type !== 'OPERATING')
    .map(s => `${esc(s.description || (s.type === 'EXTRA_HOURS' ? 'Extra hours' : s.type === 'TICKETED_EVENT' ? 'Special event' : s.type))} ${pt(s.openingTime)}–${pt(s.closingTime)}`);
  const rides = p.live.filter(x => (x.entityType || 'ATTRACTION') === 'ATTRACTION');
  const waits = rides.filter(x => x.status === 'OPERATING' && typeof x.queue?.STANDBY?.waitTime === 'number').sort((a, b) => b.queue.STANDBY.waitTime - a.queue.STANDBY.waitTime);
  const down = rides.filter(x => x.status === 'DOWN');
  const avg = waits.length ? Math.round(waits.reduce((s, x) => s + x.queue.STANDBY.waitTime, 0) / waits.length) : null;
  const cls = w => w < 20 ? 'g' : w < 45 ? 'y' : w < 70 ? 'o' : 'r';
  let h = `<div class="lgname"><span class="open-dot ${isOpen ? '' : 'no'}"></span>${esc(name)}<small>${op ? `${isOpen ? 'Open' : 'Today'} ${pt(op.openingTime)}–${pt(op.closingTime)}` : 'Closed today'}</small></div>`;
  if (extras.length) h += `<div class="pkx">✨ ${extras.join(' · ')}</div>`;
  if (!isOpen && !waits.length) {
    h += emptyBox('🌙', 'Park closed', `${esc(nextTxt)}. Wait times appear when the park opens.`);
  } else {
    h += `<div class="pkstats"><div><b>${avg ?? '–'}</b>avg wait (min)</div><div><b>${waits[0]?.queue.STANDBY.waitTime ?? '–'}</b>longest</div><div><b>${down.length}</b>down now</div></div>`;
    h += `<div class="sub">Longest waits</div><div class="rides">` +
      waits.map(x => `<div class="ride"><span>${esc(x.name)}</span><b class="wt ${cls(x.queue.STANDBY.waitTime)}">${x.queue.STANDBY.waitTime} min</b></div>`).join('') +
      down.map(x => `<div class="ride"><span>${esc(x.name)}</span><b class="wt x">Down</b></div>`).join('') + '</div>';
  }
  el.innerHTML = h + `<div class="updated">ThemeParks.wiki · updated ${fmtTime(new Date(p.at))}${p.error ? ' · ⚠️ offline' : ''}</div>`;
}

let ffTimer;
function scheduleFfRotate() {
  clearTimeout(ffTimer);
  const pages = boxPages();
  if (pages.length < 2) { ffTimer = null; return; }
  const cur = pages[state.ffPage % pages.length];
  const secs = cur?.kind === 'standings' ? Math.max(8, S.rotateSecs / 2) : S.rotateSecs;
  ffTimer = setTimeout(() => { state.ffPage = (state.ffPage + 1) % Math.max(1, boxPages().length); renderBox(); scheduleFfRotate(); }, secs * 1000);
}

const SP_SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative user-library-read';

// Shrinks a chosen photo to screen size and saves it in this browser.
async function processBg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That file isn’t an image Chrome can open.')); i.src = url; });

    for (let i = 0; i < px.length; i += 4) L += (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
    const lum = L / (px.length / 4);

    for (const w of [Math.min(target, 3840), 1920, 1280]) {
      const sc = Math.min(1, w / img.naturalWidth), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      for (const q of [0.85, 0.7, 0.55]) {
        const rec = { data: c.toDataURL('image/jpeg', q), lum };
        try { localStorage.setItem('hub.bg', JSON.stringify(rec)); return rec; } catch {}
      }
    }
    throw new Error('That image is too large to save — try a smaller one.');
  } finally { URL.revokeObjectURL(url); }
}

  try { if ('wakeLock' in navigator && !wakeLock && !document.hidden) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch {}
}

/* ================= wiring ================= */
function shift(dir) {
  const c = state.cursor;
  state.cursor = state.view === 'day' ? addDays(c, dir) : state.view === 'week' ? addDays(c, 7 * dir) : new Date(c.getFullYear(), c.getMonth() + dir, 1);
  loadEvents();
}
function setView(v) { state.view = v; loadEvents(); }
const findEvent = key => state.events.find(e => e.key === key);

$('#prev').onclick = () => shift(-1);
$('#next').onclick = () => shift(1);
$('#today').onclick = () => { state.cursor = sod(new Date()); loadEvents(); };
$('#viewseg').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
$('#addbtn').onclick = () => {
  const base = state.view === 'day' && !sameDay(state.cursor, new Date()) ? (() => { const d = new Date(state.cursor); d.setHours(9); return d; })() : roundedNow();
  openEditor(null, { start: base, end: new Date(+base + 36e5) });
};
$('#sync').onclick = () => state.sync === 'error' ? toast(state.syncMsg) : null;
$('#btn-settings').onclick = openSettings;
$('#spbtn').onclick = openSpotify;
$('#sp-prev').onclick = () => spCmd('previous');
$('#sp-play').onclick = () => spCmd('play');
$('#sp-next').onclick = () => spCmd('next');
$('#btn-sound').onclick = () => { ytMuted = !ytMuted; if (ytMuted) ytCommand('mute'); else { ytCommand('unMute'); ytCommand('setVolume', [100]); ytCommand('playVideo'); } $('#btn-sound').textContent = ytMuted ? '🔇' : '🔊'; };
$('#btn-refresh').onclick = () => { invalidate(); loadEvents(); loadWeather(); loadFantasy(); loadParks(true); toast('Refreshing…'); };
const toggleFull = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => toast('Full screen not available — press F11')); };
$('#btn-full').onclick = toggleFull;
$('#ff').addEventListener('click', e => { if (e.target.closest('[data-act=settings]')) openSettings(); });

$('#calbody').addEventListener('click', e => {
  const evEl = e.target.closest('.ev,.chip');
  if (evEl) { const ev = findEvent(evEl.dataset.key); if (ev) openEditor(ev); return; }
  const dh = e.target.closest('.tg-dh');
  if (dh) { if (state.view === 'week') { state.cursor = parseYmd(dh.dataset.day); setView('day'); } return; }
  const ad = e.target.closest('.tg-ad');
  if (ad) { const d = parseYmd(ad.dataset.day); openEditor(null, { allDay: true, start: d, end: addDays(d, 1) }); return; }
  const col = e.target.closest('.tg-col');
  if (col) {
    const y = e.clientY - col.getBoundingClientRect().top;
    const mins = Math.min(23 * 60 + 30, Math.max(0, Math.floor(y / HOUR * 2) * 30));
    const s = parseYmd(col.dataset.day); s.setMinutes(mins);
    openEditor(null, { start: s, end: new Date(+s + 36e5) }); return;
  }
  const mc = e.target.closest('.mcell');
  if (mc) { state.cursor = parseYmd(mc.dataset.day); setView('day'); }
});
document.addEventListener('keydown', e => {
  activity();
  if (e.key === 'Escape') closeModal();
  if ($('.backdrop') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft') shift(-1);
  else if (k === 'arrowright') shift(1);
  else if (k === 't') $('#today').click();
  else if (k === 'd') setView('day');
  else if (k === 'w') setView('week');
  else if (k === 'm') setView('month');
  else if (k === 'n') $('#addbtn').click();
  else if (k === 'f') toggleFull();
  else if (k === 's') openSettings();
  else if (k === 'r') $('#btn-refresh').click();
});
['mousemove', 'mousedown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, activity, { passive: true }));
document.addEventListener('mousedown', keepAwake);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); invalidate(); loadEvents(); loadWeather(); loadFantasy(); } });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { renderCalendar(); renderBox(); }, 150); });

/* ================= boot ================= */
spHandleRedirect().then(() => { renderSpBar(); spRefreshNow(); });
setInterval(() => { if (spOn() && !document.hidden) spRefreshNow(); }, 15000);
seedDemo();
applyLook(); tick(); setSync('off'); renderWeather(); renderBox(); activity(); keepAwake();
loadEvents(); loadWeather(); Promise.all([loadFantasy(), loadParks(true)]).then(scheduleFfRotate);
setInterval(() => loadParks().then(() => { if (!ffTimer) scheduleFfRotate(); }), 5 * 60e3);
setInterval(tick, 1000);
setInterval(() => { if (!$('.backdrop')) { invalidate(); loadEvents(); } }, 5 * 60e3);
setInterval(loadWeather, 20 * 60e3);
setInterval(() => loadFantasy().then(() => { if (!ffTimer) scheduleFfRotate(); }), 2 * 60e3);
</script>
</body>
